<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏅 어와나 점수판</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Malgun Gothic",sans-serif;
  background:#030616;color:#fff;min-height:100vh;padding:1.5vh 1vw;transition:.25s;
  overflow-x:hidden}
h1{text-align:center;font-size:clamp(28px,4.2vw,54px);margin:8px 0 18px;
  text-shadow:0 0 20px #6ea8ff}
#setup{width:min(560px,92vw);margin:0 auto}
#setup p.sub{color:#9fc4ff;margin:0 0 16px;font-size:15px;text-align:center}
.srow{display:flex;align-items:center;gap:8px;margin-bottom:9px;background:rgba(255,255,255,.07);
  border-radius:14px;padding:9px 12px}
.srow .sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;cursor:pointer;flex:none}
.srow .em{font-size:26px;cursor:pointer;background:none;border:none;width:44px}
.srow input{flex:1;min-width:140px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.2);
  border-radius:10px;padding:10px;color:inherit;font-size:16px;font-weight:700}
.srow input:focus{outline:none;border-color:#7ea8ff}
.srow .del{background:none;border:none;color:#ff7a7a;font-size:21px;cursor:pointer}
body.soft #setup p.sub{color:#8a6a2a}
body.soft .srow{background:#fffdf6;border:1px solid #e8dcc0}
body.soft .srow input{background:#fff;border-color:#e0d3b0;color:#3b3226}
body.soft .srow .sw{border-color:#e0d3b0}
.btn{border:none;border-radius:14px;padding:12px 20px;font-size:16px;font-weight:800;
  background:rgba(255,255,255,.16);color:inherit;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.3)}
.btn.go{background:linear-gradient(90deg,#3d8bff,#6ea8ff);color:#fff;width:100%;margin-top:8px;font-size:18px}
#bigWrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%;
  max-width:100%;max-height:100%}
.big{background:rgba(255,255,255,.07);border:3px solid;border-radius:22px;
  padding:2.2vh 1.4vw;text-align:center;min-width:240px;flex:1;max-width:440px;
  position:relative}
.bn{font-size:clamp(24px,3vh,40px);font-weight:900;margin-bottom:.6vh}
.bs{font-size:clamp(70px,15vh,190px);font-weight:900;line-height:1;color:#ffd66b;
  text-shadow:0 0 26px rgba(255,190,60,.75);margin:1.2vh 0 1.6vh}
.chips{display:flex;flex-wrap:wrap;gap:.7vh;justify-content:center;margin-top:1vh}
.chips button{border:none;border-radius:12px;padding:1.1vh 1.1vw;font-size:clamp(14px,2vh,22px);
  font-weight:800;cursor:pointer;background:rgba(255,255,255,.16);color:#fff;transition:.15s}
.chips button:hover{background:#5f7ffb;transform:translateY(-2px)}
#bigWrap[data-n="5"],#bigWrap[data-n="6"]{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(96vw,1180px)}
#bigWrap[data-n="5"] .big,#bigWrap[data-n="6"] .big{
  margin:0;padding:6px 8px;min-width:0}
#bigWrap[data-n="5"] .bs,#bigWrap[data-n="6"] .bs{
  font-size:clamp(26px,4.2vh,46px);line-height:1.05}
#bigWrap[data-n="5"] .bn,#bigWrap[data-n="6"] .bn{
  font-size:clamp(14px,2vh,20px)}
#bigWrap[data-n="5"] .chips button,#bigWrap[data-n="6"] .chips button{
  font-size:11px;padding:4px 7px}
.edit{display:flex;gap:6px;justify-content:center;margin-top:8px}
.edit button{border:1px dashed rgba(255,201,60,.7);background:transparent;color:#ffc93c;
  border-radius:999px;padding:8px 18px;font-size:15px;font-weight:800;cursor:pointer}
#tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:2vh 0 1vh;flex:none}
#game{flex-direction:column;justify-content:center;align-items:center;
  min-height:calc(100vh - 12vh);width:100%}
#bigWrap{align-items:stretch}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:12px 22px;
  border-radius:14px;background:rgba(0,0,0,.8);font-size:17px;font-weight:800;
  opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1}
body.soft{background:#fdf6e6;color:#3b3226}
body.soft h1{text-shadow:none;color:#7a5a12}
body.soft input,body.soft select{background:#fffdf6;border-color:#e0d3b0;color:#3b3226}
body.soft .btn,body.soft .chips button{background:#f0e4c6;color:#3b3226}
body.soft .btn:hover,body.soft .chips button:hover{background:#e6d6ad}
body.soft .big{background:#fffdf6}
body.soft .bs{color:#c08a2a;text-shadow:none}
body.soft .chips button:hover{background:#e0c88a}
body.soft .edit button{border-color:#c08a2a;color:#a8761d}
body.soft #toast{background:rgba(80,64,32,.9);color:#fff}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-9px,4px)}
  40%{transform:translate(8px,-5px)}60%{transform:translate(-6px,3px)}80%{transform:translate(5px,-2px)}}
body.shake{animation:shake .5s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
.big.pop{animation:pop .45s ease}
@keyframes glow{0%,100%{box-shadow:0 0 34px rgba(255,214,107,.6)}50%{box-shadow:0 0 52px rgba(255,214,107,.95)}}
.big.lead{animation:glow 1.8s ease-in-out infinite}
/* ===== 최종 레이아웃 보정 v2 (반드시 맨 마지막) ===== */
html,body{height:100%}
body{
  min-height:100dvh; margin:0;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  gap:1vh; padding:2vh 2vw; box-sizing:border-box;
}
h1{ margin:0 0 0.5vh; font-size:clamp(38px,6.4vh,76px); line-height:1.1; }
#game{
  display:flex!important; flex-direction:column;
  align-items:center; justify-content:center;
  gap:1.4vh; width:100%; min-height:0;
}
#bigWrap{
  display:flex!important; flex-wrap:wrap;
  justify-content:center; align-items:stretch;
  gap:1.4vw; width:100%; max-height:none;
}
.big{
  flex:1 1 0; min-width:250px; max-width:400px;
  padding:2.4vh 1.4vw;
}
.bn{ font-size:clamp(22px,3vh,38px); margin-bottom:0.4vh; }
.bs{ font-size:clamp(80px,16.5vh,210px); line-height:1; margin:0.6vh 0 1.6vh; }
.chips{
  display:grid!important; grid-template-columns:repeat(3,1fr);
  gap:6px; margin-top:0.8vh;
}
.chips button{ font-size:clamp(12px,1.6vh,18px); padding:1vh 4px; }
.edit{ margin-top:0.8vh; }
.edit button{ padding:0.9vh 14px; font-size:clamp(12px,1.5vh,16px); }
#tools{ margin:1vh 0 0; }
/* 5~6팀은 3열 그리드 유지 */
#bigWrap[data-n="5"],#bigWrap[data-n="6"]{ display:grid!important; }

</style></head><body>

<div id="lock" style="position:fixed;inset:0;z-index:99;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#fdf6e6">
  <div style="font-size:26px;font-weight:900;color:#7a5a12">🏆 어와나 점수판</div>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="off" style="width:220px;height:52px;text-align:center;font-size:18px;padding:0 12px;border-radius:12px;border:1px solid #e0d3b0;background:#fffdf6;color:#3b3226;flex:none">
  <button class="btn" onclick="unlock()">들어가기</button>
  <div id="pwMsg" style="color:#c04a4a;font-weight:800;font-size:14px;height:18px"></div>
</div>

<h1>🏆 어와나 점수판</h1>

<div id="setup">
  <p class="sub">색과 이모지를 눌러 바꿀 수 있어요 · 2~6팀</p>
  <div id="setupList"></div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn" style="flex:1" onclick="addTeam()">＋ 팀 추가</button>
  </div>
  <button class="btn go" onclick="start()">시작하기 →</button>
</div>

<div id="game" style="display:none">
  <div id="bigWrap"></div>
  <div id="tools">
    <button class="btn" onclick="undo()">↩️ 되돌리기</button>
    <button class="btn" onclick="hardReset()">🔄 처음부터</button>
    <button class="btn" onclick="toggleTheme()" id="thBtn">🌙 다크</button>
    <button class="btn" onclick="full()">⛶ 전체화면</button>
  </div>
</div>

<div id="toast"></div>
<canvas id="fx"></canvas>

<script>
const PAL=["#ff5252","#3d8bff","#ffc93c","#31c46b","#b06bff","#ff7ab8"];
const EMO=['🚀','🦁','🐧','🐯','🦊','🐻'];
const BTNS=[{label:"50",pt:50},{label:"100",pt:100},{label:"200",pt:200},
  {label:"300",pt:300},{label:"400",pt:400},{label:"－50",pt:-50}];
let teams=[],hist=[];

/* 소리 */
let AC=null;
function beep(f=880,d=.1,t='triangle',v=.13){
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;
  g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;
  t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1400)}

/* 폭죽 (미션보드와 동일) */
const fx=document.getElementById('fx'),fc=fx.getContext('2d');
let parts=[];
function fitFx(){fx.width=innerWidth;fx.height=innerHeight}
fitFx();addEventListener('resize',fitFx);
function burst(x,y,n=90,cols=['#ffd66b','#ff6b9d','#6bffb0','#6ba8ff','#fff']){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*9;
   parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,g:.32,
    w:5+Math.random()*7,h:8+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*.4,
    c:cols[i%cols.length],life:70+Math.random()*40});}
}
(function loop(){fc.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
   fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;
   fc.globalAlpha=Math.max(0,Math.min(1,p.life/40));
   fc.fillRect(-p.w/2,-p.h/2,p.w,p.h);fc.restore();return p.life>0&&p.y<fx.height+40});
  requestAnimationFrame(loop);})();
function shake(){document.body.classList.remove('shake');void document.body.offsetWidth;
  document.body.classList.add('shake');}
function fanfare(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.35,'triangle',.2),i*135));}

/* 설정 화면 (미션보드와 동일 방식) */
let draft=[];
function drawSetup(){
  const L=document.getElementById('setupList');L.innerHTML='';
  draft.forEach((t,i)=>{
    const r=document.createElement('div');r.className='srow';
    r.innerHTML=`<div class="sw" style="background:${t.color}"></div>
      <button class="em">${t.emoji}</button>
      <input maxlength="8" placeholder="팀 이름" value="${t.name}">
      <button class="del">✕</button>`;
    r.querySelector('.sw').onclick=()=>{
      t.color=PAL[(PAL.indexOf(t.color)+1)%PAL.length];beep(700,.06,'sine',.1);drawSetup()};
    r.querySelector('.em').onclick=()=>{
      t.emoji=EMO[(EMO.indexOf(t.emoji)+1)%EMO.length];beep(800,.06,'sine',.1);drawSetup()};
    r.querySelector('input').oninput=e=>{t.name=e.target.value};
    r.querySelector('.del').onclick=()=>{
      if(draft.length>2){draft.splice(i,1);beep(300,.12,'sine',.12);drawSetup()}
      else toast('최소 2팀은 있어야 해요')};
    L.appendChild(r);
  });
}
function addTeam(){
  if(draft.length>=6){toast('최대 6팀까지예요');return}
  const i=draft.length;
  draft.push({name:"",color:PAL[i%PAL.length],emoji:EMO[i%EMO.length]});
  beep(880,.08,'sine',.1);drawSetup();
}
draft=[0,1,2,3].map(i=>({name:"",color:PAL[i],emoji:EMO[i]}));
drawSetup();

function start(){
  teams=draft.map((t,i)=>({
    name:t.name.trim()||(i+1)+'팀',
    color:t.color,emoji:t.emoji,score:0}));
  hist=[];save();
  document.getElementById('setup').style.display='none';
  document.getElementById('game').style.display='flex';
  build();beep(880,.12);
}

/* 저장 */
function save(){localStorage.setItem('sb_teams',JSON.stringify(teams))}
function load(){
  const s=localStorage.getItem('sb_teams');if(!s)return false;
  try{teams=JSON.parse(s);return teams.length>0}catch(e){return false}
}

/* 점수판 */
function leader(){const m=Math.max(...teams.map(t=>t.score));return m>0?m:-1}
function build(){
  const w=document.getElementById('bigWrap'),ld=leader();
  w.innerHTML='';w.dataset.n=teams.length;
  teams.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='big'+(t.score===ld?' lead':'');d.style.borderColor=t.color;
    d.innerHTML=`<div class="bn" style="color:${t.color}">${t.score===ld?'👑 ':''}${t.emoji} ${t.name}</div>
      <div class="bs">${t.score}</div><div class="chips"></div>
      <div class="edit">
        <button onclick="manual(${i})">✏️ 직접 입력</button>
        <button onclick="zero(${i})">0점으로</button>
      </div>`;
    const ch=d.querySelector('.chips');
    BTNS.forEach(b=>{const btn=document.createElement('button');
      btn.textContent=b.label;btn.onclick=()=>add(i,b.pt);ch.appendChild(btn)});
    w.appendChild(d);
  });
}
function countUp(el,from,to){
  const st=performance.now(),dur=600;
  (function tick(now){
    const p=Math.min(1,(now-st)/dur);
    el.textContent=Math.round(from+(to-from)*p);
    if(p<1)requestAnimationFrame(tick);
  })(st);
}
function add(i,pt){
  const from=teams[i].score;
  hist.push({i,pt});teams[i].score+=pt;save();
  const cards=document.querySelectorAll('.big');
  if(cards[i]){
    countUp(cards[i].querySelector('.bs'),from,teams[i].score);
    cards[i].classList.add('pop');
  }
  if(pt>0&&cards[i]){
    const r=cards[i].getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,110,[teams[i].color,'#ffd66b','#fff']);
    fanfare();shake();
  }else{
    beep(392,.18,'sine',.13);
  }
  setTimeout(build,pt>0?1100:700);
}
function undo(){
  if(!hist.length){toast('되돌릴 게 없어요');return}
  const h=hist.pop();teams[h.i].score-=h.pt;save();build();
  beep(400,.15,'sine',.12);toast('되돌렸어요');
}
function manual(i){
  const t=teams[i];
  const v=prompt(`${t.name} 에게 줄 점수를 입력하세요.\n(빼려면 -50 처럼 마이너스)`,"100");
  if(v===null)return;
  const p=parseInt(v,10);
  if(isNaN(p)){toast('숫자를 입력해 주세요');return}
  add(i,p);
}
function zero(i){
  const t=teams[i];
  if(t.score===0)return;
  if(!confirm(`${t.name} 의 점수를 0점으로 되돌릴까요?\n(현재 ${t.score}점)`))return;
  add(i,-t.score);
}
function hardReset(){
  if(!confirm('점수를 모두 지우고 팀 설정부터 다시 할까요?'))return;
  localStorage.removeItem('sb_teams');location.reload();
}
function full(){
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen();
}

/* 테마 */
function setTheme(soft){
  document.body.classList.toggle('soft',soft);
  document.getElementById('thBtn').textContent=soft?'🌙 다크':'☀️ 밝게';
  localStorage.setItem('sb_theme',soft?'soft':'dark');
}
function toggleTheme(){setTheme(!document.body.classList.contains('soft'))}
setTheme(localStorage.getItem('sb_theme')==='soft');

/* 새로고침해도 유지 */
if(load()){
  document.getElementById('setup').style.display='none';
  document.getElementById('game').style.display='block';
  build();
}

/* 간단 잠금 */
const PW='awana2026';
function unlock(){
  const v=document.getElementById('pw').value;
  if(v===PW){
    document.getElementById('lock').style.display='none';
    sessionStorage.setItem('sb_ok','1');beep(880,.1);
  }else{
    document.getElementById('pwMsg').textContent='비밀번호가 달라요';
    document.getElementById('pw').value='';
  }
}
if(sessionStorage.getItem('sb_ok'))document.getElementById('lock').style.display='none';
document.getElementById('pw').addEventListener('keydown',e=>{
  if(e.key==='Enter')unlock();
});

addEventListener('keydown',e=>{
  if(e.key==='z'||e.key==='Z')undo();
  if(e.key==='f'||e.key==='F')full();
});
</script></body></html>
